<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Universia</title>
    <link rel="stylesheet" href="css/ranking.css">
</head>
<body>
    <div class="top">
        <div class="title">
            <h1>RANKING</h1>
        </div>
    </div>
    <div class="ranking-container">
        <div class="ranking-actions">
            <button id="refresh-ranking">ACTUALIZAR</button>
            <span id="ranking-status">Ultima actualizacion: --</span>
        </div>
        <ol id="ranking-list" data-ranking-list></ol>
    </div>
    <div class="bottom">
        <a href="main.html"><button id="volver">VOLVER</button></a>
    </div>
    <script src="js/background-music.js"></script>
    <script>
        // Auto-detectar el entorno y configurar la API URL
        if (window.location.hostname.includes('devtunnels.ms')) {
            // Usar la misma URL base para servidor unificado
            window.SCORES_API_URL = window.location.origin;
        } else {
            // Entorno local - usar puerto 5501 por defecto para servidor unificado
            window.SCORES_API_URL = 'http://localhost:5501';
        }
        console.log('🔗 API URL configurada:', window.SCORES_API_URL);
        console.log('🌐 Entorno detectado:', window.location.hostname.includes('devtunnels.ms') ? 'Túnel' : 'Local');
    </script>
    <script type="module" src="js/ranking.js"></script>
</body>
</html>

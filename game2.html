<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivel 2 - Universia</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="contenedor">
      <button id="pause">PAUSA</button>
      <div id="pauseOverlay" class="overlay-backdrop">
        <div class="overlay-menu">
          <button id="resumeBtn">CONTINUAR</button>
          <button id="reloadBtn">REINICIAR</button>
          <button id="settingsBtn">CONFIGURACIÓN</button>
          <button id="exitBtn">SALIR AL MENÚ</button>
        </div>
      </div>
      <div id="settingsOverlay" class="overlay-backdrop">
        <div class="settings-panel">
          <h2>Ajustes Rápidos</h2>
          <label for="overlayVolume">Volumen</label>
          <input type="range" id="overlayVolume" min="0" max="100" value="80">
          <button id="closeSettingsBtn">VOLVER</button>
        </div>
      </div>
    <div class="informacion"></div>

    <div id="EnergyUI">
      <div style="background: #01295F; height: 20px; border-radius: 5px; overflow: hidden;">
          <div id="playerEnergyUI" style="background: #FFB30F; height: 100%; width: 100%; transition: width 0.3s;"></div>
        </div>
        <p id="playerEnergyTextUI" style="margin: 5px 0 0 0; font-size: 14px;">Energia: 100/100</p>
    </div>
    
    <div id="escena3D"></div>
    <!-- UI de Combate -->
    <div id="battleUI">
      <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
        <!-- Jugador -->
        <div style="flex: 1; margin-right: 10px;">
          <h3 id="playerName" style="margin: 0 0 5px 0;">Unicornio</h3>
          <div style="background: #333; height: 20px; border-radius: 5px; overflow: hidden;">
            <div id="playerHP" style="background: #849324; height: 100%; width: 100%; transition: width 0.3s;"></div>
          </div>
          <p id="playerHPText" style="margin: 5px 0 0 0; font-size: 14px;">HP: 100/100</p>
          <div style="background: #333; height: 20px; border-radius: 5px; overflow: hidden;">
            <div id="playerEnergy" style="background: #FFB30F; height: 100%; width: 100%; transition: width 0.3s;"></div>
          </div>
          <p id="playerEnergyText" style="margin: 5px 0 0 0; font-size: 14px;">Energia: 100/100</p>
        </div>
        <!-- Enemigo -->
        <div style="flex: 1; margin-left: 10px;">
          <h3 id="enemyName" style="margin: 0 0 5px 0;">Elefante</h3>
          <div style="background: #333; height: 20px; border-radius: 5px; overflow: hidden;">
            <div id="enemyHP" style="background: #FD151B; height: 100%; width: 100%; transition: width 0.3s;"></div>
          </div>
          <p id="enemyHPText" style="margin: 5px 0 0 0; font-size: 14px;">HP: 100/100</p>
        </div>
      </div>
      <!-- Mensaje de batalla -->
      <div id="battleMessage" style="background: #222; padding: 10px; border-radius: 5px; margin-bottom: 15px; min-height: 40px;">
        <p style="margin: 0;">Presiona ATACAR para comenzar el combate</p>
      </div>
      <!-- Botones de acción -->
      <div id="battleActions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button id="attackBtn" class="battle-buttons">ATACAR</button>
        <button id="specialBtn" class="battle-buttons">ATAQUE ESPECIAL</button>
        <button id="defendBtn" class="battle-buttons">DEFENDER</button>
        <button id="runBtn" class="battle-buttons">HUIR</button>
      </div>
    </div>
    <!-- Indicador de interacción -->
    <div id="interactPrompt" style="display: none; position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%); background: #012a5fc4; padding: 15px 30px; 
        border-radius: 10px; color: #FDF0D5; font-size: 18px;">
      Presiona <strong>E</strong> para iniciar combate
    </div>
  </div>
  <script src="js/sweetalert2.all.min.js"></script>
  <script src="js/pause-menu"></script>
  <script type="module" src="js/game-level2.js"></script>
  <script src="js/background-music.js"></script>
</body>
</html>

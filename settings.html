<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universia</title>
    <link rel="stylesheet" href="css/sweet-alert.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div class="contenedor">
        <h1>Configuracion</h1>
        <div class="informacion">
            <div class="opciones">
                <label for="username" >Nombre de usuario</label>
                <input type="text" id="username" placeholder="Tu nombre de usuario" disabled>

                <label for="correo">Correo electronico</label>
                <input type="email" id="correo" placeholder="Tu correo" disabled>

                <label for="volume">Volumen</label>
                <input type="range" id="volume" min="0" max="100" value="80">
            </div>
        </div>
        <div class="botones">
            <button id="back-settings" type="button">REGRESAR</button>
            <button id="save-settings" type="button">GUARDAR</button>
        </div>
    </div>
    <script src="js/background-music.js"></script>
    <script type="module" src="js/settings.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
</body>
</html>

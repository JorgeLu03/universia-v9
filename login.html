<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universia</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/sweet-alert.css">
</head>
<body>
    <div class="contenedor">
        <h1> Ingresa tus datos</h1>
        <br>
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" autocomplete="email">
        <br>
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password">
        <br>
        <div class="botones" style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
            <a href="main.html"><button type="button">REGRESAR</button></a>
            <button id="btn-login" type="button">INICIAR SESIÓN</button>
        </div>
        <div class="divider">
            <span>O</span>
        </div>
        <div class="botones" style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
            <button id="btn-google" type="button" style="background: #4285f4; color: white; display: flex; align-items: center; gap: 8px; padding: 10px 20px;">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuar con Google
            </button>
        </div>
        
        <!-- Indicador de estado para Google login -->
        <div id="google-login-status" style="display: none; text-align: center; margin-top: 15px; padding: 10px; border-radius: 5px;">
            <span id="status-text">Procesando...</span>
        </div>
        <p>¿Aún no tienes cuenta?
            <a href="register.html">Regístrate</a>
        </p>
        
    </div>
    <script type="module" src="js/login.js"></script>
    <script src="js/background-music.js"></script>
    <script src="js/sweetalert2.all.min.js"></script>
</body>
</html>
